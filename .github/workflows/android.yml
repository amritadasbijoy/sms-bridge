name: Android

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testWebDebugUnitTest lintWebDebug lintPlayDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: android/app/build/reports/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test against PostgreSQL (Testcontainers) and build
        run: ./gradlew test installDist

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests (crypto vectors from the Android app, message merging)
        run: npm test
      - run: npm run typecheck
      - run: npm run build
